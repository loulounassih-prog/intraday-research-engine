[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-research-engine"
version = "0.1.0"
description = "A Python research engine for intraday quantitative signals."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["intraday_research_engine*"]